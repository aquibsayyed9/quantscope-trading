<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Crypto Exchange</title>
	<link rel="stylesheet" href="css/styles.css">
</head>

<body>
	<div class="container">
		<!-- Header -->
		<header>
			<h1>Exchange</h1>
			<div class="user-selector">
				<label>Trading as:</label>
				<select id="userSelect">
					<option value="alice">Alice</option>
					<option value="bob">Bob</option>
				</select>
			</div>
		</header>

		<!-- Main Trading Area -->
		<div class="trading-grid">
			<!-- Left: Order Form -->
			<div class="card order-form">
				<h2>Place Order</h2>
				<form id="orderForm">
					<div class="form-group">
						<label>Symbol</label>
						<input type="text" id="symbol" value="BTCUSDT" required>
					</div>

					<div class="form-row">
						<div class="form-group">
							<label>Side</label>
							<select id="side" required>
								<option value="BUY">Buy</option>
								<option value="SELL">Sell</option>
							</select>
						</div>
						<div class="form-group">
							<label>Type</label>
							<select id="orderType" required>
								<option value="LIMIT">Limit</option>
								<option value="MARKET">Market</option>
							</select>
						</div>
					</div>

					<div class="form-row">
						<div class="form-group">
							<label>Price</label>
							<input type="number" id="price" step="0.01" required>
						</div>
						<div class="form-group">
							<label>Quantity</label>
							<input type="number" id="quantity" step="0.001" required>
						</div>
					</div>

					<div class="form-group">
						<label>Time in Force</label>
						<select id="tif" required>
							<option value="GTC">GTC</option>
							<option value="IOC">IOC</option>
							<option value="FOK">FOK</option>
						</select>
					</div>

					<button type="submit" class="btn-primary">Place Order</button>
				</form>
				<div id="orderStatus" class="status-message"></div>
			</div>

			<!-- Middle: Order Book -->
			<div class="card order-book">
				<h2>Order Book - <span id="obSymbol">BTCUSDT</span></h2>
				<div class="book-container">
					<div class="asks-section">
						<div class="book-header">
							<span>Price</span>
							<span>Quantity</span>
						</div>
						<div id="asks"></div>
					</div>
					<div class="spread">Spread: <span id="spread">-</span></div>
					<div class="bids-section">
						<div class="book-header">
							<span>Price</span>
							<span>Quantity</span>
						</div>
						<div id="bids"></div>
					</div>
				</div>
			</div>

			<!-- Right: Recent Trades -->
			<div class="card trades">
				<h2>Recent Trades</h2>
				<div class="trades-header">
					<span>Price</span>
					<span>Qty</span>
					<span>Time</span>
				</div>
				<div id="tradesList"></div>
			</div>
		</div>

		<!-- Bottom: User Orders -->
		<div class="card user-orders">
			<h2>My Orders</h2>
			<div id="userOrdersList"></div>
		</div>
	</div>

	<script src="js/app.js"></script>
</body>

</html>
